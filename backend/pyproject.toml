[project]
name = "media-ops-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "cryptography>=43",
    "celery[redis]>=5.4",
    "google-auth[requests]>=2.35",
    "pypdf>=5",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
