# Nginx configuration for Media Ops API
# Replace 'api.mediaops.yourdomain.edu' and SSL certificate paths with your own.

server {
    listen 80;
    server_name api.mediaops.yourdomain.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.mediaops.yourdomain.edu;

    ssl_certificate /etc/letsencrypt/live/api.mediaops.yourdomain.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mediaops.yourdomain.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # Rate limiting zone (optional, defined in nginx http block):
    # limit_req zone=api_limit burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
