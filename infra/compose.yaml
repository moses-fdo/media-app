services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: media
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
  api:
    build: ../backend
    env_file: ${ENV_FILE:-../backend/.env.production}
    command: sh -c 'alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000'
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ../backend
    env_file: ${ENV_FILE:-../backend/.env.production}
    command: celery -A app.jobs.celery_app worker --loglevel=info --concurrency=2
    depends_on: [api]
  scheduler:
    build: ../backend
    env_file: ${ENV_FILE:-../backend/.env.production}
    command: celery -A app.jobs.celery_app beat --loglevel=info
    depends_on: [api]
volumes:
  postgres-data:
  redis-data:
